name: Android-APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pakete installieren
        run: npm install

      - name: Android-Projekt erzeugen (Icons, Splash, Einstellungen)
        run: npm run setup:android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../sakuga-edit.apk

      - name: APK als Build-Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: sakuga-edit-apk
          path: sakuga-edit.apk

      - name: APK unter "Releases" veröffentlichen (zum Download aufs Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Sakuga Edit – neueste Android-Version
          prerelease: true
          make_latest: false
          files: sakuga-edit.apk
          body: |
            Automatisch gebaut aus dem neuesten Stand von main.
            Auf dem Android-Handy herunterladen, öffnen und "Installation aus unbekannten Quellen" erlauben.
